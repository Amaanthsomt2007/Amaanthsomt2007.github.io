<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionHub  | Sign Up</title>
    <script src="fashion_script.js" defer></script>
    <link rel="stylesheet" href="fashion_style.css">
    <script src="https://kit.fontawesome.com/cb08ec855e.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <div>
            <a href="index.html" class="back"><i class="fa-solid fa-chevron-left"></i> Back</a>
        </div>
        
        <div class="signup">
           <h1>Sign Up</h1>
        </div>
    </header>
   
   <form id="form" class="form1">
           <div class="credentials">
               <input type="text" placeholder="Surname/First Name" id="surname" required>
       <input type="text" placeholder="Other Names" id="other_names" required>
       <input type="text" placeholder="Username" id="user_name" required>
       <input type="password" placeholder="Password (e.g +-aA125$&)" id="Password" required>
       </div>
       
           <div class="credentials">
               <h3>Address</h3>
           <input type="text" placeholder="Address" id="address" required>
           <input type="text" placeholder="City/Town" id="city" required>
       <input type="text" placeholder="State" id="state" required>
       </div>
       
       <button type="submit" id="submit_1">Submit</button>
       
       <p>Already have an account? <a id="Login_link"href="#">Log In</a></p>
   </form>
   
   
</body>
</html>
